name: CI / Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid overlapping deploys if multiple pushes land quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify static Space and Python utilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check static Space files exist
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f README.md

      - name: Check static entrypoint references its assets
        run: |
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html

      - name: Compile Python utilities (syntax check)
        run: python -m py_compile src/*.py tests/*.py

      - name: Run unit tests
        run: pytest tests/ -v

  deploy:
    name: Deploy to Hugging Face Space
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: seahli
          HF_SPACE_NAME: SoundAnalysis1
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN GitHub Actions secret is missing."
            exit 1
          fi
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" HEAD:main
